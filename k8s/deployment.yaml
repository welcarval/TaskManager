apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager
  namespace: default
  labels:
    app: task-manager
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      name: task-manager
      labels:
        app: task-manager
    spec:
      containers:
        - name: task-manager
          image: arc:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: "KEY"
              value: "VALUE"